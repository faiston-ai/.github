name: 🤖 Pedido de automação
description: Sugestão avulsa de automação (fora do mapeamento de áreas)
labels: ["tipo: demanda", "status: triagem"]
body:
  - type: markdown
    attributes:
      value: |
        A Engenharia de IA mapeia as áreas ativamente — este formulário é para ideias que surgirem fora desse mapeamento.
        O pedido entra no inventário de tarefas da sua área e é priorizado junto com as demais.
        Quanto mais concreto, melhor.
  - type: input
    id: area
    attributes:
      label: Área solicitante
      placeholder: Logística, Financeiro, Field Service, Comercial...
    validations:
      required: true
  - type: input
    id: solicitante
    attributes:
      label: Quem pediu (nome)
    validations:
      required: true
  - type: textarea
    id: processo
    attributes:
      label: Como o processo é feito hoje
      description: Passo a passo do jeito manual. Quais sistemas/planilhas são usados?
    validations:
      required: true
  - type: input
    id: frequencia
    attributes:
      label: Frequência e volume
      placeholder: "Ex.: 40 vezes por dia, ~15 min cada"
    validations:
      required: true
  - type: input
    id: pessoas
    attributes:
      label: Quantas pessoas fazem isso
  - type: dropdown
    id: sistemas
    attributes:
      label: Sistemas envolvidos
      multiple: true
      options:
        - ERP / sistema interno
        - Planilhas (Excel / Google Sheets)
        - E-mail
        - WhatsApp
        - Tiflux / chamados
        - Power BI
        - Portal de cliente
        - Outro
  - type: dropdown
    id: dados
    attributes:
      label: Envolve dados pessoais ou sensíveis?
      description: CPF, dados de cliente, financeiro, etc. (LGPD)
      options:
        - Não
        - Sim
        - Não sei
    validations:
      required: true
  - type: textarea
    id: sucesso
    attributes:
      label: Como seria o "deu certo"
      description: "Ex.: a NF sai sozinha e o analista só confere."
    validations:
      required: true
